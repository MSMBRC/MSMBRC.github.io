<meta charset="UTF-8">

<title>Guybrush in watercolor · MSMBRC</title>

<style>
  :root {
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Fraunces', Georgia, serif;
    --font-mono: 'Fraunces', ui-monospace, monospace;
    --max-width: 500px;
    --gutter: clamp(12px, 4vw, 16px);
    --nav-h: 78px;
  }

  html[data-theme="light"] {
    --bg: #ffffff;
    --bg-elevated: #F2F1EC;
    --text-primary: #17181A;
    --text-secondary: #55575C;
    --text-tertiary: #8A8C90;
    --border: #E2E1DA;
    --accent: #0D9488;
    --accent-text: #ffffff;
    --focus-ring: #0D9488;
  }

  html[data-theme="dark"] {
    --bg: #121314;
    --bg-elevated: #1B1C1E;
    --text-primary: #F2F2EF;
    --text-secondary: #A8AAAE;
    --text-tertiary: #74767A;
    --border: #2B2C2F;
    --accent: #2DD4C4;
    --accent-text: #0A1615;
    --focus-ring: #2DD4C4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light dark; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
    padding-top: var(--nav-h);
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--accent-text); }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 2px; }

  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

   
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    min-height: var(--nav-h); background: var(--bg);
    padding: 10px var(--gutter);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    font-family: var(--font-display); font-weight: 500; font-size: 16px;
  }
  .topnav .logo { display: flex; flex-direction: column; gap: 4px; }
  .topnav .logo a { font-weight: 500; }
  .topnav .logo a:hover { opacity: 0.8; }
  .topnav .logo .tagline {
    font-family: var(--font-body); font-weight: 400; font-size: 13px;
    color: var(--text-secondary); letter-spacing: -0.005em;
  }
  .topnav .theme-toggle, .topnav .view-toggle { flex-shrink: 0; margin-top: 2px; }
  .topnav .nav-actions { display: flex; align-items: center; gap: 8px; }

  .theme-toggle, .view-toggle {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg-elevated);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .theme-toggle:hover, .view-toggle:hover { border-color: var(--text-tertiary); transform: scale(1.05); }
  .theme-toggle svg, .view-toggle svg { width: 15px; height: 15px; stroke: var(--text-primary); fill: none; stroke-width: 1.8; }
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  .view-toggle .icon-grid { display: none; }
  body.grid-view .view-toggle .icon-list { display: none; }
  body.grid-view .view-toggle .icon-grid { display: block; }

  main { padding-top: 40px; padding-bottom: 40px; }

  .article-list { list-style: none; border-top: 1px solid var(--border); }
  .article-item { padding: 40px 0; border-bottom: 1px solid var(--border); }

   
  body.grid-view .wrap { max-width: 1120px; padding-left: 0; padding-right: 0; }
  body.grid-view .article-list {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    border-top: none;
  }

  @media (max-width: 600px) {
    body.grid-view .article-list { grid-template-columns: repeat(2, 1fr); }
  }
  body.grid-view .article-item {
    padding: 0; border: none;
    display: flex; flex-direction: column; height: 100%;
  }
  body.grid-view .article-content { display: flex; flex: 1; }
  body.grid-view .article-content img { width: 100%; height: 100%; margin: 0; border-radius: 0; object-fit: cover; }
  body.grid-view .article-content img:not(:first-of-type) { display: none; }
  body.grid-view .article-list .article-date,
  body.grid-view .article-list .article-title { display: none; }
  body.grid-view .article-list .article-content p:not(:has(img)) { display: none; }
  body.grid-view .article-content p { margin-bottom: 0; }

  .article-date {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-tertiary); display: block; margin-bottom: 10px;
  }

  .article-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1.3; margin-bottom: 16px; }
  a.article-title-link {
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat; background-position: 0 100%; background-size: 0% 2px;
    transition: background-size 0.2s ease;
  }
  a.article-title-link:hover { background-size: 100% 2px; }

   
  .article-content { font-size: 18px; color: var(--text-primary); width: 100%; }
  .article-content p { margin-bottom: 1.1em; }
  .article-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 1.2em 0; display: block; cursor: zoom-in; }
  .article-content video, .article-content iframe { max-width: 100%; border-radius: 6px; margin: 1.2em 0; }
  .article-content a { color: var(--accent); text-underline-offset: 3px; text-decoration: underline; }
  .article-content h1, .article-content h2, .article-content h3 { font-family: var(--font-display); font-weight: 700; margin: 1.4em 0 0.5em; }
  .article-content ul, .article-content ol { margin: 0 0 1.1em 1.3em; }
  .article-content blockquote { border-left: 2px solid var(--accent); padding-left: 16px; color: var(--text-secondary); margin: 1.1em 0; }
  .article-content code { font-family: var(--font-mono); font-size: 0.9em; background: var(--bg-elevated); padding: 2px 5px; border-radius: 4px; }
  .article-content pre { background: var(--bg-elevated); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 1.1em 0; }
  .article-content pre code { background: none; padding: 0; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 48px 0 80px; font-family: var(--font-mono); font-size: 13px; }
  .page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-secondary); transition: background 0.15s ease, color 0.15s ease; }
  a.page-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .page-btn.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .page-btn.arrow { font-size: 16px; }
  span.page-btn[aria-disabled="true"] { color: var(--border); }

  footer.site { border-top: 1px solid var(--border); padding: 28px 0 64px; font-size: 13px; color: var(--text-tertiary); display: flex; justify-content: space-between; }
  footer.site a:hover { color: var(--text-primary); }

  .lightbox {
    position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.9);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; visibility: hidden; transition: opacity 0.2s ease;
  }
  .lightbox.open { opacity: 1; visibility: visible; }
  .lightbox-content {
    display: flex; width: 100%; max-width: 1100px; max-height: 90vh;
    background: var(--bg); border-radius: 8px; overflow: hidden;
  }
  .lightbox-media { position: relative; flex: 1 1 60%; min-width: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  .lightbox-media img { max-width: 100%; max-height: 90vh; width: auto; height: auto; object-fit: contain; cursor: zoom-out; }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .lightbox-nav:hover { background: rgba(0, 0, 0, 0.65); }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-dots { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; gap: 6px; }
  .lightbox-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); cursor: pointer; }
  .lightbox-dot.active { background: #fff; }
  .lightbox-meta { flex: 1 1 40%; padding: 32px; overflow-y: auto; color: var(--text-primary); }
  .lightbox-meta .article-date { margin-bottom: 12px; }
  .lightbox-meta .article-title { font-size: 18px; margin-bottom: 16px; }

  @media (max-width: 700px) {
    .lightbox-content { flex-direction: column; max-height: 92vh; }
    .lightbox-media img { max-height: 45vh; }
    .lightbox-meta { flex: 1 1 auto; }
    body.grid-view .lightbox-content { max-height: none; }
    body.grid-view .lightbox-media img { max-height: none; }
    body.grid-view .article-content { font-size: 12px; }
    body.grid-view .lightbox-meta { padding: 12px; }
    body.grid-view .lightbox-meta .article-title { font-size: 16px; margin-bottom: 14px; }
  }

  @media (max-width: 600px) {
    :root { --nav-h: 92px; }
    .article-title { font-size: 19px; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <span class="logo">
    <a href="/">MSMBRC</a>
    <span class="tagline">My journey back to drawing like I used to, before I turn 40 (April 2027).</span>
  </span>
  <span class="nav-actions">
    
    <button class="theme-toggle" id="themeToggle" aria-label="Cambia tema">
      <svg class="icon-sun" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6z"/></svg>
    </button>
  </span>
</nav>

<div class="wrap">
  <main>
    
  <article class="article-item" style="border-top:1px solid var(--border); border-bottom:none; padding-top:40px;">
    <span class="article-date">29 August 2026</span>
    <h1 class="article-title" style="font-size:28px;">Guybrush in watercolor</h1>
    <div class="article-content"><p><img src="/uploads/20260829.webp" alt=""></p>
<p>Guybrush colored with watercolor, using a no-blending technique.</p>
</div>
  </article>
  <p style="margin-top:32px;"><a class="article-title-link" style="font-size:14px; color:var(--text-secondary);" href="/">← Tutti gli articoli</a></p>

  </main>

  <footer class="site">
    <span>© 2026 MSMBRC</span>
    <a href="/index.xml">RSS</a>
  </footer>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <div class="lightbox-media">
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Immagine precedente">‹</button>
      <img id="lightboxImg" src="" alt="">
      <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Immagine successiva">›</button>
      <div class="lightbox-dots" id="lightboxDots"></div>
    </div>
    <div class="lightbox-meta">
      <span class="article-date" id="lightboxDate"></span>
      <h2 class="article-title" id="lightboxTitle"></h2>
      <div class="article-content" id="lightboxDesc"></div>
    </div>
  </div>
</div>

<script>
  const toggle = document.getElementById('themeToggle');
  const root = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  toggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme');
    root.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
  });

  const viewToggle = document.getElementById('viewToggle');
  if (viewToggle) {
    if (localStorage.getItem('viewMode') !== 'list') {
      document.body.classList.add('grid-view');
    }
    viewToggle.addEventListener('click', () => {
      const isGrid = document.body.classList.toggle('grid-view');
      localStorage.setItem('viewMode', isGrid ? 'grid' : 'list');
    });
  }

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxDate = document.getElementById('lightboxDate');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxDesc = document.getElementById('lightboxDesc');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  const lightboxDots = document.getElementById('lightboxDots');

  let currentImages = [];
  let currentIndex = 0;

  const renderLightboxImage = () => {
    const img = currentImages[currentIndex];
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt;
    lightboxDots.querySelectorAll('.lightbox-dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === currentIndex);
    });
  };

  const showImage = (index) => {
    currentIndex = (index + currentImages.length) % currentImages.length;
    renderLightboxImage();
  };

  document.querySelectorAll('.article-item').forEach((item) => {
    const images = Array.from(item.querySelectorAll('.article-content img'));
    images.forEach((img) => {
      img.addEventListener('click', () => {
        currentImages = images;
        currentIndex = images.indexOf(img);

        const dateEl = item.querySelector('.article-date');
        const titleEl = item.querySelector('.article-title');
        lightboxDate.textContent = dateEl ? dateEl.textContent : '';
        lightboxTitle.textContent = titleEl ? titleEl.textContent : '';

        lightboxDesc.innerHTML = '';
        item.querySelectorAll('.article-content p:not(:has(img))').forEach((p) => {
          lightboxDesc.appendChild(p.cloneNode(true));
        });

        const multi = images.length > 1;
        lightboxPrev.style.display = multi ? 'flex' : 'none';
        lightboxNext.style.display = multi ? 'flex' : 'none';
        lightboxDots.innerHTML = '';
        if (multi) {
          images.forEach((_, i) => {
            const dot = document.createElement('span');
            dot.className = 'lightbox-dot';
            dot.addEventListener('click', (e) => {
              e.stopPropagation();
              showImage(i);
            });
            lightboxDots.appendChild(dot);
          });
        }

        renderLightboxImage();
        lightbox.classList.add('open');
      });
    });
  });

  lightboxPrev.addEventListener('click', (e) => {
    e.stopPropagation();
    showImage(currentIndex - 1);
  });
  lightboxNext.addEventListener('click', (e) => {
    e.stopPropagation();
    showImage(currentIndex + 1);
  });

  const closeLightbox = () => {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  };

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
    if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  });
</script>

</body>
</html>
